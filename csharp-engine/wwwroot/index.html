<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSharpEngineBlazor</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="CSharpEngineBlazor.styles.css" rel="stylesheet" /> -->
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
      Blazor.start().then(async () => {
        const exports = await Blazor.runtime.getAssemblyExports('CSharpEngineBlazor');
        const json = await exports.CSharpEngineBlazor.CSharpEngine.RunCode('int x = 2 + 2; Console.WriteLine($"x = {x}");');
        console.log('CSHARP_RESULT:' + json);
      }).catch((err) => console.error('BOOT_ERROR:' + err));
    </script>
</body>

</html>
