name: Wendehals Release

# Baut das Spiel "Wendehals" (Ordner wendehals/) und veröffentlicht es als GitHub-Release
# mit festem Tag "wendehals-latest". Die Download-Links bleiben dadurch immer gleich, z. B.
# https://github.com/RobinDerRobin/SQLLernTool/releases/download/wendehals-latest/Wendehals-SteamDeck.AppImage

on:
  push:
    branches: [ccr-d78728c5-ncws9h]
    paths:
      - 'wendehals/**'
      - '.github/workflows/wendehals-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wendehals-release
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wendehals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run check:welt
      - run: npm run dist:linux
      - name: Dateien mit festen Namen
        run: |
          mkdir -p ../out
          cp release/*.AppImage ../out/Wendehals-SteamDeck.AppImage
          cp dist/index.html ../out/Wendehals-Browser.html
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wendehals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Datei mit festem Namen
        shell: bash
        run: |
          mkdir -p ../out
          cp release/*.exe ../out/Wendehals-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Tag auf diesen Stand setzen
        run: |
          git tag -f wendehals-latest "$GITHUB_SHA"
          git push -f origin wendehals-latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: wendehals-latest
          name: Wendehals (aktuellster Stand)
          make_latest: false
          body: |
            Aktuellster Stand des Spiels Wendehals (Commit ${{ github.sha }}).

            - Steam Deck / Linux: Wendehals-SteamDeck.AppImage (ausführbar machen, als Nicht-Steam-Spiel hinzufügen)
            - Windows: Wendehals-Windows.exe (ohne Installation)
            - Browser: Wendehals-Browser.html (Doppelklick, offline)
          files: out/*
          fail_on_unmatched_files: true
