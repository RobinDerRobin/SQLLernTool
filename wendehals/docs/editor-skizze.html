<title>Wendehals-Editor Skizze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Werkzeugfenster wie ein Level-Editor – Kopfzeile mit Ebenen-Pfad, links Palette, Mitte Draufsicht, rechts Eigenschaften, unten Prüfer */
:root{
  --bg:#e9eeed; --panel:#f7f9f8; --ink:#1b2a31; --muted:#5a6a70; --line:#c6d1d0; --grid:#d3dfde; --grid2:#bccbca;
  --floor:#fbfdfc; --void:#c3cfce; --accent:#1d6b88; --accent-soft:#d6e8ee;
  --turn:#c97a10; --bad:#bd3b27; --warn:#a8700f; --good:#2b7a4b; --enemy:#7246ad; --piece:#237f78; --wall:#3c4e56;
  --ui:"Barlow Semi Condensed",system-ui,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181b; --panel:#172126; --ink:#dde7e7; --muted:#8ea0a4; --line:#2b3a40; --grid:#1c282c; --grid2:#26363b;
  --floor:#1a252a; --void:#080d0f; --accent:#5ab3d1; --accent-soft:#1d3640;
  --turn:#f0a43a; --bad:#f06752; --warn:#e2b14c; --good:#5ac283; --enemy:#ad88e6; --piece:#4cc0b6; --wall:#9fb3ba; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181b; --panel:#172126; --ink:#dde7e7; --muted:#8ea0a4; --line:#2b3a40; --grid:#1c282c; --grid2:#26363b;
  --floor:#1a252a; --void:#080d0f; --accent:#5ab3d1; --accent-soft:#1d3640;
  --turn:#f0a43a; --bad:#f06752; --warn:#e2b14c; --good:#5ac283; --enemy:#ad88e6; --piece:#4cc0b6; --wall:#9fb3ba; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;padding-inline:16px;padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
.app{display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;height:100%;min-height:560px;max-width:1500px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.01em}
h1 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px;text-transform:uppercase;letter-spacing:.08em}
.crumbs{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.crumbs button{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:3px 6px;border-radius:4px}
.crumbs button[aria-current="true"]{color:var(--ink);background:var(--accent-soft)}
.crumbs span{color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
button.t{font:inherit;font-size:14px;font-weight:500;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer}
button.t:hover{border-color:var(--accent)}
button.t[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
button.play{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:0}
.main{display:grid;grid-template-columns:150px minmax(0,1fr) 230px;gap:10px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0;overflow:auto}
.pane h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:600}
.pal{display:flex;flex-direction:column;gap:6px}
.pal button{display:flex;align-items:center;gap:8px;text-align:left;font:inherit;background:none;border:1px solid transparent;border-radius:5px;padding:6px;color:var(--ink);cursor:pointer}
.pal button:hover{border-color:var(--line);background:var(--bg)}
.pal svg{flex:none}
.plan{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:300px}
.plan svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.legend{position:absolute;left:8px;bottom:6px;font-size:12px;color:var(--muted);pointer-events:none;font-family:var(--mono)}
.props label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.06em}
.props input,.props select{width:100%;font:inherit;font-family:var(--mono);font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 7px}
.props .ro{font-family:var(--mono);font-size:14px;padding:5px 0}
.props .row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.props .kind{font-weight:700;font-size:16px}
.props p{margin:6px 0;color:var(--muted);font-size:13px;line-height:1.4}
footer{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px}
footer b{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.msg{display:inline-flex;gap:5px;align-items:baseline;cursor:default}
.msg .r{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ok{color:var(--good)} .err{color:var(--bad)} .wrn{color:var(--warn)}
.textview{position:absolute;inset:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:auto;padding:10px;font-family:var(--mono);font-size:12.5px;line-height:1.45;white-space:pre;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:14px;max-width:min(92vw,560px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
/* SVG */
.g-minor{stroke:var(--grid);stroke-width:1;vector-effect:non-scaling-stroke}
.g-major{stroke:var(--grid2);stroke-width:1;vector-effect:non-scaling-stroke}
.void{fill:var(--void)} .floor{fill:var(--floor)}
.edge{stroke:var(--wall);stroke-width:2;fill:none;vector-effect:non-scaling-stroke}
.o-wand{fill:var(--wall)} .o-hindernis{fill:var(--bad);fill-opacity:.85} .o-setpiece{fill:var(--piece);fill-opacity:.8} .o-gegner{fill:var(--enemy)}
.sel{stroke:var(--accent);stroke-width:3;fill:none;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.turnzone{fill:var(--turn);fill-opacity:.12;stroke:var(--turn);stroke-dasharray:8 6;stroke-width:2;vector-effect:non-scaling-stroke}
.node{fill:var(--panel);stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}
.node.save{fill:var(--accent-soft)} .node.boss{fill:var(--bad);fill-opacity:.25}
.lbl{fill:var(--ink);font-family:var(--ui);font-weight:600}
.lbl.m{fill:var(--muted);font-weight:500}
.lbl.mono{font-family:var(--mono);font-weight:400}
.hot{fill:var(--bad);fill-opacity:.25}
.gang-line{stroke:var(--floor);stroke-linecap:butt}
.gang-out{stroke:var(--wall);stroke-linecap:butt}
.gang-line.bad{stroke:var(--bad);stroke-opacity:.35}
.area{fill:var(--floor);stroke:var(--wall);stroke-width:2;vector-effect:non-scaling-stroke}
.link{stroke:var(--wall);stroke-width:3;stroke-dasharray:10 6;vector-effect:non-scaling-stroke}
.pick{cursor:grab} .pick:active{cursor:grabbing}
@media (max-width:820px){
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .plan{height:58vh;order:-1}
  .pal{flex-direction:row;flex-wrap:wrap}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s}}
</style>

<div class="app">
  <header>
    <h1>Wendehals-Editor <small>Optik-Skizze</small></h1>
    <nav class="crumbs" id="crumbs" aria-label="Ebenen"></nav>
    <div class="tools">
      <button class="t" id="undo" title="Rückgängig (Strg+Z)">↶ Rückgängig</button>
      <button class="t" id="snap" aria-pressed="true" title="Einrasten an 20er-Raster">▦ Raster</button>
      <button class="t" id="zout" title="Herauszoomen">−</button>
      <button class="t" id="zin" title="Hineinzoomen">+</button>
      <button class="t" id="text" aria-pressed="false" title="Die Datei hinter der Ansicht zeigen">{ } Als Text</button>
      <button class="t play" id="play">▶ Spielen ab hier</button>
    </div>
  </header>
  <p class="note">Nur zum Anschauen: Nichts wird gespeichert, und die Prüfregeln sind Beispiele, nicht beschlossen. Die Gebietsnamen sind Platzhalter (Setting offen). Doppelklick öffnet eine Ebene. Ziehen verschiebt. Entf löscht, R dreht um 45°.</p>
  <div class="main">
    <aside class="pane"><h2 id="palTitle">Palette</h2><div class="pal" id="pal"></div></aside>
    <div class="plan" id="planWrap">
      <svg id="plan" xmlns="http://www.w3.org/2000/svg" aria-label="Draufsicht"></svg>
      <div class="legend" id="legend"></div>
      <div class="textview" id="textview" hidden></div>
    </div>
    <aside class="pane props" id="props"></aside>
  </div>
  <footer id="pruefer" aria-live="polite"></footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const NS='http://www.w3.org/2000/svg';
const KREUZ_FREI=160, MIN_DURCH=60, ENG=100;
const TYPNAME={wand:'Wand',hindernis:'Hindernis',setpiece:'Set-Piece',gegner:'Gegnergruppe',kreuzung:'Kreuzung',raum:'Raum',speicher:'Speicherort',boss:'Boss'};
const RICHT=['O','SO','S','SW','W','NW','N','NO'];

let S={
  ebene:'gang', gebiet:'kanal', gang:'schleuse', sel:null, raster:true, text:false, zoom:{gang:1.4,gebiet:1,welt:1}, pan:{gang:0,gebiet:0,welt:0}, panY:{gang:0,gebiet:0,welt:0},
  welt:{gebiete:[
    {id:'kanal',name:'Kanal',thema:'Rost, Wasser',x:180,y:200},
    {id:'glas',name:'Gewächshaus',thema:'Glas, Ranken',x:560,y:120},
    {id:'uhr',name:'Uhrwerk',thema:'Zahnräder',x:520,y:400}],
    links:[['kanal','glas'],['kanal','uhr'],['glas','uhr']]},
  kanal:{
    knoten:[
      {id:'K1',typ:'speicher',x:0,y:0},{id:'K2',typ:'kreuzung',x:1800,y:0},{id:'K3',typ:'raum',x:1800,y:-1000},
      {id:'K4',typ:'kreuzung',x:2500,y:700},{id:'K5',typ:'boss',x:0,y:-1000}],
    gaenge:[
      {id:'schleuse',name:'Schleuse',von:'K1',nach:'K2',tempo:'Gefecht'},
      {id:'steigrohr',name:'Steigrohr',von:'K2',nach:'K3',tempo:'Cruise'},
      {id:'ueberlauf',name:'Überlauf',von:'K2',nach:'K4',tempo:'Gefecht'},
      {id:'hauptrohr',name:'Hauptrohr',von:'K5',nach:'K3',tempo:'Halt'},
      {id:'fallrohr',name:'Fallrohr',von:'K1',nach:'K5',tempo:'Cruise'}]},
  inhalt:{
    schleuse:{breite:200,objekte:[
      {id:1,typ:'wand',a:420,c:-70,len:240,br:60,win:0},
      {id:2,typ:'hindernis',a:720,c:40,len:90,br:90,win:45},
      {id:3,typ:'gegner',a:920,c:-10,len:70,br:70,win:0,welle:'Schwarm ×5'},
      {id:4,typ:'setpiece',a:1120,c:-50,len:200,br:90,win:0,name:'Pumpe'},
      {id:5,typ:'wand',a:1340,c:70,len:180,br:60,win:0},
      {id:6,typ:'gegner',a:1480,c:30,len:70,br:70,win:0,welle:'Geschütz'},
      {id:7,typ:'wand',a:1690,c:65,len:120,br:70,win:0}]},
    steigrohr:{breite:200,objekte:[]},ueberlauf:{breite:200,objekte:[]},hauptrohr:{breite:400,objekte:[]},fallrohr:{breite:120,objekte:[]}
  }
};
let hist=[], nextId=100;
const $=id=>document.getElementById(id);
const svg=$('plan');
const snap=v=>S.raster?Math.round(v/20)*20:Math.round(v);
const knoten=id=>S.kanal.knoten.find(k=>k.id===id);
const gangDef=id=>S.kanal.gaenge.find(g=>g.id===id);
function gangLen(g){const a=knoten(g.von),b=knoten(g.nach);return Math.round(Math.hypot(b.x-a.x,b.y-a.y));}
function gangDir(g){const a=knoten(g.von),b=knoten(g.nach);const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;const k=Math.round(ang/45);return {ok:Math.abs(ang-k*45)<0.5,name:RICHT[((k%8)+8)%8],ang};}
function save(){hist.push(JSON.stringify({kanal:S.kanal,inhalt:S.inhalt,welt:S.welt}));if(hist.length>80)hist.shift();}
function undo(){const h=hist.pop();if(!h)return toast('Nichts mehr rückgängig zu machen.');Object.assign(S,JSON.parse(h));S.sel=null;render();}
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,3200);}

/* ---------- Ansicht ---------- */
function setView(x0,y0,w,h){const z=S.zoom[S.ebene];const cx=x0+w/2+S.pan[S.ebene],cy=y0+h/2+S.panY[S.ebene];const W=w/z,H=h/z;svg.setAttribute('viewBox',`${cx-W/2} ${cy-H/2} ${W} ${H}`);svg.setAttribute('preserveAspectRatio','xMidYMid meet');}
function grid(x0,y0,w,h,step,major){const g=el('g',{},svg);
  for(let x=Math.floor(x0/step)*step;x<=x0+w;x+=step)el('line',{x1:x,y1:y0,x2:x,y2:y0+h,class:x%major===0?'g-major':'g-minor'},g);
  for(let y=Math.floor(y0/step)*step;y<=y0+h;y+=step)el('line',{x1:x0,y1:y,x2:x0+w,y2:y,class:y%major===0?'g-major':'g-minor'},g);}

function bbox(o){const r=o.win*Math.PI/180,c=Math.abs(Math.cos(r)),s=Math.abs(Math.sin(r));return {hw:(c*o.len+s*o.br)/2,hh:(s*o.len+c*o.br)/2};}

/* ---------- Gang ---------- */
function renderGang(){
  const g=gangDef(S.gang),inh=S.inhalt[S.gang],L=gangLen(g),w=inh.breite;
  const pad=260,H=Math.max(700,w+420);
  setView(-pad,-H/2,L+2*pad,H);
  el('rect',{x:-pad-4000,y:-4000,width:L+2*pad+8000,height:8000,class:'void'},svg);
  el('rect',{x:-w/2-40,y:-w/2,width:L+w+80,height:w,class:'floor'},svg);
  // Kreuzungen an beiden Enden
  for(const [k,a] of [[g.von,0],[g.nach,L]]){
    el('rect',{x:a-w/2-(a?0:0),y:-w/2-60,width:w,height:w+120,class:'floor'},svg);
    el('rect',{x:(a?a:a-KREUZ_FREI),y:-w/2,width:KREUZ_FREI,height:w,class:'turnzone'},svg);
    const t=el('text',{x:a,y:-w/2-80,'text-anchor':'middle','font-size':34,class:'lbl'},svg);t.textContent=`${k} · ${TYPNAME[knoten(k).typ]}`;
  }
  grid(-pad-2000,-H/2-2000,L+2*pad+4000,H+4000,20,200);
  el('line',{x1:-w/2-40,y1:-w/2,x2:L+w/2+40,y2:-w/2,class:'edge'},svg);
  el('line',{x1:-w/2-40,y1:w/2,x2:L+w/2+40,y2:w/2,class:'edge'},svg);
  // Engstellen markieren
  for(const h of pruefeGang().heiss)el('rect',{x:h.a0,y:-w/2,width:Math.max(10,h.a1-h.a0),height:w,class:'hot'},svg);
  for(const o of inh.objekte){
    const gr=el('g',{transform:`translate(${o.a} ${o.c}) rotate(${o.win})`,class:'pick','data-id':o.id},svg);
    if(o.typ==='gegner'){
      for(const [dx,dy] of [[-18,-14],[16,-16],[0,8],[-20,18],[20,16]])el('circle',{cx:dx,cy:dy,r:11,class:'o-gegner'},gr);
      el('rect',{x:-o.len/2,y:-o.br/2,width:o.len,height:o.br,fill:'transparent'},gr);
    } else el('rect',{x:-o.len/2,y:-o.br/2,width:o.len,height:o.br,rx:o.typ==='hindernis'?8:2,class:'o-'+o.typ},gr);
    if(S.sel===o.id)el('rect',{x:-o.len/2-8,y:-o.br/2-8,width:o.len+16,height:o.br+16,class:'sel'},gr);
    const lab=o.typ==='setpiece'?o.name:o.typ==='gegner'?o.welle:null;
    if(lab){const t=el('text',{x:o.a,y:o.c+bbox(o).hh+30,'text-anchor':'middle','font-size':24,class:'lbl m'},svg);t.textContent=lab;}
  }
  // Flugrichtung
  const ar=el('text',{x:L/2,y:w/2+60,'text-anchor':'middle','font-size':26,class:'lbl m mono'},svg);ar.textContent=`${g.von} → ${g.nach} · ${L} E · Richtung ${gangDir(g).name} · Breite ${w}`;
  $('legend').textContent=`Gang „${g.name}“ – Norden oben gedreht in Flugrichtung · Raster 20 / 200 E`;
}
function pruefeGang(){
  const g=gangDef(S.gang),inh=S.inhalt[S.gang],L=gangLen(g),w=inh.breite;
  const block=inh.objekte.filter(o=>o.typ!=='gegner').map(o=>({o,...bbox(o)}));
  const msgs=[],heiss=[];let minGap=Infinity,engRun=null,engN=0,zuRun=null,zuA=null;
  for(let a=0;a<=L;a+=10){
    const iv=block.filter(b=>Math.abs(a-b.o.a)<=b.hw).map(b=>[Math.max(-w/2,b.o.c-b.hh),Math.min(w/2,b.o.c+b.hh)]).filter(v=>v[1]>v[0]).sort((p,q)=>p[0]-q[0]);
    let cur=-w/2,gap=0;for(const [s,e] of iv){gap=Math.max(gap,s-cur);cur=Math.max(cur,e);}gap=Math.max(gap,w/2-cur);
    minGap=Math.min(minGap,gap);
    if(gap<ENG){if(!engRun){engRun={a0:a,a1:a};engN++;}engRun.a1=a;}else if(engRun){heiss.push(engRun);engRun=null;}
    if(gap<MIN_DURCH&&zuA===null)zuA=a;
  }
  if(engRun)heiss.push(engRun);
  msgs.push(zuA===null?{k:'ok',t:'passierbar',r:'M1'}:{k:'err',t:`nicht passierbar bei ${zuA} E (frei < ${MIN_DURCH})`,r:'M1'});
  for(const [k,lo,hi] of [[g.von,0,KREUZ_FREI],[g.nach,L-KREUZ_FREI,L]]){
    const hit=block.find(b=>b.o.a+b.hw>lo&&b.o.a-b.hw<hi);
    msgs.push(hit?{k:'err',t:`kein Platz vor ${k}: ${TYPNAME[hit.o.typ]} in der Drehzone (${KREUZ_FREI} E frei)`,r:'M2'}:{k:'ok',t:`Drehzone ${k} frei`,r:'M2'});
  }
  const out=inh.objekte.find(o=>o.a<0||o.a>L||Math.abs(o.c)>w/2);
  if(out)msgs.push({k:'err',t:`${TYPNAME[out.typ]} liegt außerhalb des Gangs`,r:'M3'});
  if(engN>=3)msgs.push({k:'wrn',t:`${engN} Engstellen (< ${ENG} frei) – viel Druck auf einmal?`,r:'S1'});
  const geg=inh.objekte.filter(o=>o.typ==='gegner').length;
  msgs.push(geg?{k:'ok',t:`${geg} Gegnergruppe${geg>1?'n':''}`,r:'S2'}:{k:'wrn',t:'keine Gegner – als Cruise gedacht?',r:'S2'});
  return {msgs,heiss};
}

/* ---------- Gebiet ---------- */
function renderGebiet(){
  const ks=S.kanal.knoten,xs=ks.map(k=>k.x),ys=ks.map(k=>k.y);
  const x0=Math.min(...xs)-500,y0=Math.min(...ys)-450,w=Math.max(...xs)-Math.min(...xs)+1000,h=Math.max(...ys)-Math.min(...ys)+900;
  setView(x0,y0,w,h);
  el('rect',{x:x0-5000,y:y0-5000,width:w+10000,height:h+10000,class:'floor'},svg);
  grid(x0-2000,y0-2000,w+4000,h+4000,100,500);
  for(const g of S.kanal.gaenge){
    const a=knoten(g.von),b=knoten(g.nach),br=S.inhalt[g.id].breite,ok=gangDir(g).ok;
    const gr=el('g',{class:'pick','data-gang':g.id},svg);
    el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,'stroke-width':br+16,class:'gang-out'},gr);
    el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,'stroke-width':br,class:'gang-line'+(ok?'':' bad')},gr);
    if(S.sel==='g:'+g.id)el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,'stroke-width':br+60,class:'sel'},gr);
    const t=el('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-br/2-30,'text-anchor':'middle','font-size':64,class:'lbl'},svg);t.textContent=g.name;
    const t2=el('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2+br/2+70,'text-anchor':'middle','font-size':48,class:'lbl m mono'},svg);t2.textContent=`${gangLen(g)} E · ${g.tempo}`;
  }
  for(const k of ks){
    const gr=el('g',{class:'pick','data-knoten':k.id,transform:`translate(${k.x} ${k.y})`},svg);
    if(k.typ==='raum'||k.typ==='boss')el('rect',{x:-180,y:-180,width:360,height:360,rx:20,class:'node '+k.typ},gr);
    else{ el('circle',{r:KREUZ_FREI+60,class:'turnzone'},gr); el('rect',{x:-130,y:-130,width:260,height:260,transform:'rotate(45)',class:'node '+(k.typ==='speicher'?'save':'')},gr);}
    if(S.sel==='k:'+k.id)el('circle',{r:280,class:'sel'},gr);
    const t=el('text',{y:20,'text-anchor':'middle','font-size':64,class:'lbl'},gr);t.textContent=k.id;
  }
  $('legend').textContent='Gebiet „Kanal“ – Grundriss, Norden oben · Raster 100 / 500 E · Gänge nur im 45°-Raster';
}
function pruefeGebiet(){
  const msgs=[];
  const schief=S.kanal.gaenge.filter(g=>!gangDir(g).ok);
  msgs.push(schief.length?{k:'err',t:`nicht im 45°-Raster: ${schief.map(g=>g.name).join(', ')}`,r:'M4'}:{k:'ok',t:'alle Gänge im 45°-Raster',r:'M4'});
  const lose=S.kanal.knoten.filter(k=>!S.kanal.gaenge.some(g=>g.von===k.id||g.nach===k.id));
  if(lose.length)msgs.push({k:'wrn',t:`ohne Gang: ${lose.map(k=>k.id).join(', ')}`,r:'M5'});
  const sp=S.kanal.knoten.some(k=>k.typ==='speicher');
  msgs.push(sp?{k:'ok',t:'Speicherort vorhanden',r:'M6'}:{k:'err',t:'kein Speicherort im Gebiet',r:'M6'});
  const kurz=S.kanal.gaenge.filter(g=>gangLen(g)<600);
  if(kurz.length)msgs.push({k:'wrn',t:`sehr kurz: ${kurz.map(g=>g.name).join(', ')}`,r:'S3'});
  msgs.push({k:'ok',t:`${S.kanal.knoten.length} Knoten, ${S.kanal.gaenge.length} Level`,r:''});
  return msgs;
}

/* ---------- Welt ---------- */
function renderWelt(){
  setView(0,0,800,560);
  el('rect',{x:-3000,y:-3000,width:7000,height:7000,class:'floor'},svg);
  grid(-1000,-1000,3000,3000,20,100);
  const by=Object.fromEntries(S.welt.gebiete.map(g=>[g.id,g]));
  for(const [a,b] of S.welt.links)el('line',{x1:by[a].x,y1:by[a].y,x2:by[b].x,y2:by[b].y,class:'link'},svg);
  for(const g of S.welt.gebiete){
    const gr=el('g',{class:'pick','data-gebiet':g.id,transform:`translate(${g.x} ${g.y})`},svg);
    el('rect',{x:-90,y:-50,width:180,height:100,rx:14,class:'area'},gr);
    if(S.sel==='w:'+g.id)el('rect',{x:-100,y:-60,width:200,height:120,rx:18,class:'sel'},gr);
    const t=el('text',{y:-8,'text-anchor':'middle','font-size':22,class:'lbl'},gr);t.textContent=g.name;
    const t2=el('text',{y:20,'text-anchor':'middle','font-size':14,class:'lbl m'},gr);t2.textContent=g.thema;
    const t3=el('text',{y:38,'text-anchor':'middle','font-size':12,class:'lbl m mono'},gr);t3.textContent=g.id==='kanal'?`${S.kanal.knoten.length} Knoten · ${S.kanal.gaenge.length} Level`:'leer';
  }
  $('legend').textContent='Welt – Gebiete und Verbindungen (Platzhalter-Namen)';
}
function pruefeWelt(){return [{k:'ok',t:'alle Gebiete erreichbar',r:'W1'},{k:'wrn',t:'Gewächshaus und Uhrwerk noch leer',r:''},{k:'wrn',t:'Progression (Schlösser, Fähigkeiten) noch nicht geprüft',r:'W2'}];}

/* ---------- Paneele ---------- */
const ICON={
  wand:'<rect x="2" y="6" width="20" height="8" fill="var(--wall)"/>',
  hindernis:'<rect x="6" y="4" width="11" height="11" rx="2" transform="rotate(45 11.5 9.5)" fill="var(--bad)"/>',
  setpiece:'<rect x="2" y="4" width="20" height="12" fill="var(--piece)"/>',
  gegner:'<circle cx="7" cy="7" r="4" fill="var(--enemy)"/><circle cx="16" cy="8" r="4" fill="var(--enemy)"/><circle cx="11" cy="15" r="4" fill="var(--enemy)"/>',
  kreuzung:'<rect x="6" y="3" width="11" height="11" transform="rotate(45 11.5 8.5)" fill="none" stroke="var(--ink)" stroke-width="2"/>',
  raum:'<rect x="4" y="2" width="16" height="16" rx="2" fill="none" stroke="var(--ink)" stroke-width="2"/>',
  speicher:'<rect x="6" y="3" width="11" height="11" transform="rotate(45 11.5 8.5)" fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="2"/>',
  boss:'<rect x="4" y="2" width="16" height="16" rx="2" fill="var(--bad)" fill-opacity=".3" stroke="var(--ink)" stroke-width="2"/>',
  gebiet:'<rect x="2" y="4" width="20" height="12" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/>'
};
function renderPal(){
  const list=S.ebene==='gang'?['wand','hindernis','setpiece','gegner']:S.ebene==='gebiet'?['kreuzung','raum','speicher','boss']:['gebiet'];
  $('palTitle').textContent=S.ebene==='gang'?'Objekte':S.ebene==='gebiet'?'Knoten':'Welt';
  $('pal').innerHTML=list.map(t=>`<button data-add="${t}"><svg width="24" height="20" viewBox="0 0 24 20">${ICON[t]}</svg>${t==='gebiet'?'Gebiet':TYPNAME[t]}</button>`).join('')+
    (S.ebene==='gang'?'<p class="note" style="margin-top:6px">Drehorte gibt es nur an Knoten, nicht im Gang (Checkliste 4a).</p>':'')+
    (S.ebene==='gebiet'?'<p class="note" style="margin-top:6px">Gänge ziehen: in der Skizze nicht umgesetzt.</p>':'');
}
function field(lbl,id,val,type='number',step=10){return `<label for="${id}">${lbl}</label><input id="${id}" type="${type}" step="${step}" value="${val}">`;}
function sel(lbl,id,val,opts){return `<label for="${id}">${lbl}</label><select id="${id}">${opts.map(o=>`<option ${o==val?'selected':''}>${o}</option>`).join('')}</select>`;}
function renderProps(){
  const P=$('props');let h='<h2>Eigenschaften</h2>';
  if(S.ebene==='gang'){
    const inh=S.inhalt[S.gang],o=inh.objekte.find(o=>o.id===S.sel),g=gangDef(S.gang);
    if(!o){h+=`<div class="kind">Gang „${g.name}“</div><div class="ro">${g.von} → ${g.nach} · ${gangLen(g)} E</div>${field('Breite','p-breite',inh.breite)}<p>Länge und Richtung kommen aus dem Gebiet. Ein Objekt anklicken, um es zu bearbeiten.</p>`;}
    else{
      h+=`<div class="kind">${TYPNAME[o.typ]}</div>`+field('Lage im Gang (a)','p-a',o.a)+field('Quer (c)','p-c',o.c)+field('Länge','p-len',o.len)+field('Breite','p-br',o.br)+sel('Winkel','p-win',o.win,[0,45,90,135]);
      if(o.typ==='setpiece')h+=field('Name','p-name',o.name,'text');
      if(o.typ==='gegner')h+=sel('Welle','p-welle',o.welle,['Schwarm ×5','Geschütz','Jäger ×2','Mine ×3']);
      h+=`<div class="row"><button class="t" id="p-rot">⟳ 45°</button><button class="t" id="p-dup">Kopieren</button><button class="t" id="p-del">Löschen</button></div>`;
    }
  } else if(S.ebene==='gebiet'){
    if(S.sel&&S.sel.startsWith('k:')){const k=knoten(S.sel.slice(2));h+=`<div class="kind">Knoten ${k.id}</div>`+sel('Typ','p-ktyp',TYPNAME[k.typ],['Kreuzung','Raum','Speicherort','Boss'])+field('x','p-kx',k.x,'number',100)+field('y','p-ky',k.y,'number',100)+'<p>Kreuzungen und Speicherorte sind Drehorte (gestrichelter Ring).</p>';}
    else if(S.sel&&S.sel.startsWith('g:')){const g=gangDef(S.sel.slice(2)),d=gangDir(g);h+=`<div class="kind">Level „${g.name}“</div><div class="ro">${g.von} → ${g.nach} · ${gangLen(g)} E · ${d.ok?d.name:'schief!'}</div>`+field('Name','p-gname',g.name,'text')+sel('Tempo','p-tempo',g.tempo,['Gefecht','Cruise','Halt'])+field('Breite','p-gbr',S.inhalt[g.id].breite,'number',20)+`<div class="row"><button class="t play" id="p-open">Öffnen ▸</button></div>`;}
    else h+='<div class="kind">Gebiet „Kanal“</div><div class="ro">Thema: Rost, Wasser</div><p>Knoten ziehen verschiebt sie; die Gänge gehen mit. Ein schiefer Gang wird rot. Doppelklick auf einen Gang öffnet das Level.</p>';
  } else {
    const g=S.sel&&S.sel.startsWith('w:')?S.welt.gebiete.find(x=>x.id===S.sel.slice(2)):null;
    if(g)h+=`<div class="kind">Gebiet</div>`+field('Name','p-wname',g.name,'text')+field('Thema','p-wthema',g.thema,'text')+`<div class="row"><button class="t play" id="p-wopen">Öffnen ▸</button></div>`;
    else h+='<div class="kind">Welt</div><p>Gebiete und ihre Verbindungen. Doppelklick auf „Kanal“ öffnet das Gebiet.</p>';
  }
  P.innerHTML=h;
  const bind=(id,fn)=>{const e=$(id);if(e)e.addEventListener('change',()=>{save();fn(e.value);render();});};
  if(S.ebene==='gang'){
    const inh=S.inhalt[S.gang],o=inh.objekte.find(o=>o.id===S.sel);
    bind('p-breite',v=>inh.breite=Math.max(60,+v));
    if(o){for(const [id,k] of [['p-a','a'],['p-c','c'],['p-len','len'],['p-br','br']])bind(id,v=>o[k]=+v);
      bind('p-win',v=>o.win=+v);bind('p-name',v=>o.name=v);bind('p-welle',v=>o.welle=v);
      $('p-rot').onclick=rot;$('p-del').onclick=del;$('p-dup').onclick=()=>{save();const n={...o,id:nextId++,a:o.a+60};inh.objekte.push(n);S.sel=n.id;render();};}
  } else if(S.ebene==='gebiet'){
    if(S.sel&&S.sel.startsWith('k:')){const k=knoten(S.sel.slice(2));const inv=Object.fromEntries(Object.entries(TYPNAME).map(([a,b])=>[b,a]));
      bind('p-ktyp',v=>k.typ=inv[v]);bind('p-kx',v=>k.x=+v);bind('p-ky',v=>k.y=+v);}
    if(S.sel&&S.sel.startsWith('g:')){const g=gangDef(S.sel.slice(2));bind('p-gname',v=>g.name=v);bind('p-tempo',v=>g.tempo=v);bind('p-gbr',v=>S.inhalt[g.id].breite=Math.max(60,+v));$('p-open').onclick=()=>openGang(g.id);}
  } else {const g=S.sel&&S.sel.startsWith('w:')?S.welt.gebiete.find(x=>x.id===S.sel.slice(2)):null;if(g){bind('p-wname',v=>g.name=v);bind('p-wthema',v=>g.thema=v);$('p-wopen').onclick=()=>openGebiet(g.id);}}
}
function renderPruefer(){
  const m=S.ebene==='gang'?pruefeGang().msgs:S.ebene==='gebiet'?pruefeGebiet():pruefeWelt();
  const sym={ok:'✔',err:'✘',wrn:'⚠'};
  $('pruefer').innerHTML='<b>Prüfer</b>'+m.map(x=>`<span class="msg ${x.k}">${sym[x.k]} ${x.t}${x.r?` <span class="r">${x.r}</span>`:''}</span>`).join('');
}
function renderCrumbs(){
  const g=gangDef(S.gang);
  const items=[['welt','Welt'],['gebiet','Gebiet „Kanal“'],['gang',`Level „${g.name}“`]];
  $('crumbs').innerHTML=items.map(([e,t],i)=>`${i?'<span>▸</span>':''}<button data-ebene="${e}" aria-current="${S.ebene===e}">${t}</button>`).join('');
}
function renderText(){
  const tv=$('textview');tv.hidden=!S.text;if(!S.text)return;
  let o;
  if(S.ebene==='gang'){const g=gangDef(S.gang);o={level:g.id,name:g.name,von:g.von,nach:g.nach,breite:S.inhalt[g.id].breite,objekte:S.inhalt[g.id].objekte.map(({id,...r})=>r)};}
  else if(S.ebene==='gebiet')o={gebiet:'kanal',thema:'Rost, Wasser',knoten:S.kanal.knoten,level:S.kanal.gaenge.map(g=>({...g,breite:S.inhalt[g.id].breite}))};
  else o=S.welt;
  tv.textContent='// So sähe die Datei aus (Quelle der Wahrheit). Editor, KI und Prüfer lesen dieselbe Datei.\n'+JSON.stringify(o,null,2).replace(/\{\n\s+([^{}\[\]]{0,140}?)\n\s+\}/g,(m,b)=>'{ '+b.replace(/\n\s+/g,' ')+' }');
}
function render(){svg.innerHTML='';({gang:renderGang,gebiet:renderGebiet,welt:renderWelt})[S.ebene]();renderPal();renderProps();renderPruefer();renderCrumbs();renderText();$('play').disabled=S.ebene==='welt';$('play').style.opacity=S.ebene==='welt'?.5:1;}

/* ---------- Aktionen ---------- */
function openGang(id){S.gang=id;S.ebene='gang';S.sel=null;render();}
function openGebiet(id){if(id!=='kanal')return toast('In der Skizze ist nur „Kanal“ ausgearbeitet.');S.ebene='gebiet';S.sel=null;render();}
function rot(){const o=S.inhalt[S.gang].objekte.find(o=>o.id===S.sel);if(!o)return;save();o.win=(o.win+45)%180;render();}
function del(){
  if(S.ebene==='gang'){const inh=S.inhalt[S.gang];if(S.sel==null)return;save();inh.objekte=inh.objekte.filter(o=>o.id!==S.sel);S.sel=null;render();}
}
function add(t){
  save();
  if(S.ebene==='gang'){const L=gangLen(gangDef(S.gang)),vb=svg.viewBox.baseVal;const a=snap(Math.min(L-200,Math.max(200,vb.x+vb.width/2)));
    const base={wand:{len:160,br:60},hindernis:{len:80,br:80},setpiece:{len:200,br:90,name:'Neues Stück'},gegner:{len:70,br:70,welle:'Schwarm ×5'}}[t];
    const o={id:nextId++,typ:t,a,c:0,win:0,...base};S.inhalt[S.gang].objekte.push(o);S.sel=o.id;}
  else if(S.ebene==='gebiet'){const vb=svg.viewBox.baseVal;let n=6;while(knoten('K'+n))n++;const k={id:'K'+n,typ:t,x:Math.round((vb.x+vb.width/2)/100)*100,y:Math.round((vb.y+vb.height/2)/100)*100};S.kanal.knoten.push(k);S.sel='k:'+k.id;}
  else {const id='neu'+nextId++;S.welt.gebiete.push({id,name:'Neues Gebiet',thema:'offen',x:320,y:440});S.welt.links.push(['kanal',id]);S.sel='w:'+id;}
  render();
}
function play(){
  if(S.ebene==='gang'){const o=S.inhalt[S.gang].objekte.find(o=>o.id===S.sel);const a=o?Math.max(0,o.a-300):0;toast(`Würde jetzt den Prototyp im Level „${gangDef(S.gang).name}“ bei a = ${a} E starten. Esc führt zurück in den Editor.`);}
  else if(S.ebene==='gebiet'){const k=S.sel&&S.sel.startsWith('k:')?S.sel.slice(2):'K1';toast(`Würde jetzt den Prototyp an Knoten ${k} starten. Esc führt zurück in den Editor.`);}
}

/* ---------- Zeiger ---------- */
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
let drag=null;
svg.addEventListener('pointerdown',e=>{
  const t=e.target.closest('[data-id],[data-knoten],[data-gang],[data-gebiet]');const p=pt(e);
  if(t&&t.dataset.id){const o=S.inhalt[S.gang].objekte.find(o=>o.id==t.dataset.id);S.sel=o.id;drag={kind:'o',o,dx:o.a-p.x,dy:o.c-p.y,moved:false,snapshot:null};}
  else if(t&&t.dataset.knoten){const k=knoten(t.dataset.knoten);S.sel='k:'+k.id;drag={kind:'k',o:k,dx:k.x-p.x,dy:k.y-p.y,moved:false};}
  else if(t&&t.dataset.gang){S.sel='g:'+t.dataset.gang;drag=null;}
  else if(t&&t.dataset.gebiet){const g=S.welt.gebiete.find(x=>x.id===t.dataset.gebiet);S.sel='w:'+g.id;drag={kind:'w',o:g,dx:g.x-p.x,dy:g.y-p.y,moved:false};}
  else {S.sel=null;drag={kind:'pan',x:e.clientX,y:e.clientY,px:S.pan[S.ebene],py:S.panY[S.ebene],moved:false};}
  svg.setPointerCapture(e.pointerId);render();
});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(drag.kind==='pan'){const vb=svg.viewBox.baseVal,r=svg.getBoundingClientRect(),s=Math.max(vb.width/r.width,vb.height/r.height);S.pan[S.ebene]=drag.px-(e.clientX-drag.x)*s;S.panY[S.ebene]=drag.py-(e.clientY-drag.y)*s;drag.moved=true;render();return;}
  const p=pt(e);if(!drag.moved){save();drag.moved=true;}
  if(drag.kind==='o'){drag.o.a=snap(p.x+drag.dx);drag.o.c=snap(p.y+drag.dy);}
  else if(drag.kind==='k'){drag.o.x=S.raster?Math.round((p.x+drag.dx)/100)*100:Math.round(p.x+drag.dx);drag.o.y=S.raster?Math.round((p.y+drag.dy)/100)*100:Math.round(p.y+drag.dy);}
  else if(drag.kind==='w'){drag.o.x=snap(p.x+drag.dx);drag.o.y=snap(p.y+drag.dy);}
  render();
});
svg.addEventListener('pointerup',()=>{drag=null;});
svg.addEventListener('dblclick',e=>{
  const t=e.target.closest('[data-gang],[data-gebiet]');if(!t)return;
  if(t.dataset.gang)openGang(t.dataset.gang);else openGebiet(t.dataset.gebiet);
});
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15);},{passive:false});
function zoom(f){S.zoom[S.ebene]=Math.min(6,Math.max(.4,S.zoom[S.ebene]*f));render();}

$('crumbs').addEventListener('click',e=>{const b=e.target.closest('[data-ebene]');if(!b)return;S.ebene=b.dataset.ebene;S.sel=null;render();});
$('pal').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b)add(b.dataset.add);});
$('undo').onclick=undo;
$('snap').onclick=()=>{S.raster=!S.raster;$('snap').setAttribute('aria-pressed',S.raster);toast(S.raster?'Einrasten an. Gespeichert werden trotzdem nur Zahlen, kein Raster.':'Einrasten aus: freie Lage.');};
$('zin').onclick=()=>zoom(1.25);$('zout').onclick=()=>zoom(1/1.25);
$('text').onclick=()=>{S.text=!S.text;$('text').setAttribute('aria-pressed',S.text);renderText();};
$('play').onclick=play;
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
  else if(e.key==='Delete'||e.key==='Backspace'){del();}
  else if(e.key==='r'||e.key==='R'){rot();}
  else if(e.key==='Escape'){if(S.ebene==='gang')S.ebene='gebiet';else if(S.ebene==='gebiet')S.ebene='welt';S.sel=null;render();}
});
S.sel=7;render();
</script>
